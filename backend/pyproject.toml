[project]
name = "backend"
version = "0.1.0"
description = "Cloud Coding Agent - Agent loop with Gemini Interactions API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.2.0",
    "fastapi>=0.141.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "uvicorn>=0.52.3",
    "google-genai>=1.0.0",
    "aiofiles>=23.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
